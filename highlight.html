<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TUYỂN THỦ ĐIỂM NHẤN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
padding:40px;
}

h1{
text-align:center;
margin-bottom:40px;
color:#e50914;
}

.players{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
}

.card{
background:#181818;
border-radius:15px;
padding:20px;
text-align:center;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 20px #e50914;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin-top:15px;
}

.card p{
color:#ff4b4b;
margin-top:8px;
font-weight:bold;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
background:#181818;
padding:25px;
border-radius:15px;
width:360px;
text-align:center;
position:relative;
}

.popup-box img{
width:220px;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:20px;
}

.popup-box p{
margin:10px 0;
}

.close{
position:absolute;
right:20px;
top:10px;
font-size:30px;
cursor:pointer;
color:white;
}

.back{
display:block;
width:220px;
margin:40px auto;
padding:15px;
background:#e50914;
color:white;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🏆 TUYỂN THỦ ĐIỂM NHẤN</h1>

<div class="players">

<div class="card" onclick="showPlayer('ASU.PER','NGUYỄN CÔNG LÝ','29/12/2007','RUSHER','ALLSTAR UNITED ESPORTS','file_000000000524820983f928befb30d9fd.png')">
<img src="file_000000000524820983f928befb30d9fd.png">
<h3>🥇 ASU.PER</h3>
<p>190 Votes</p>
</div>

<div class="card" onclick="showPlayer('ASU.NOTAR7','NGUYỄN THÀNH CÔNG','23/05/2011','BOMMER','ALLSTAR UNITED ESPORTS','Picsart_26-07-29_10-20-49-233.jpg')">
<img src="Picsart_26-07-29_10-20-49-233.jpg">
<h3>🥈 ASU.NOTAR7</h3>
<p>178 Votes</p>
</div>

<div class="card" onclick="showPlayer('ASU.HZE','PHAN NGUYỄN ANH KHOA','28/06/2011','BOMMER','ALLSTAR UNITED ESPORTS','file_00000000413c8209a4280751ea1425a4.png')">
<img src="file_00000000413c8209a4280751ea1425a4.png">
<h3>ASU.HZE</h3>
<p>143 Votes</p>
</div>

<div class="card" onclick="showPlayer('ASU.KEN','TRẦN NGUYỄN GIA NGUYÊN','02/10/2011','SUPPORT','ALLSTAR UNITED ESPORTS','file_000000005d2c820996b97a94141384d0.png')">
<img src="file_000000005d2c820996b97a94141384d0.png">
<h3>ASU.KEN</h3>
<p>110 Votes</p>
</div>

<div class="card" onclick="showPlayer('ASU.MANJIRO','NGUYỄN THÀNH DANH','16/10/2011','SUPPORT','ALLSTAR UNITED ESPORTS','file_00000000ffb08209b396599d4a090a27.png')">
<img src="file_00000000ffb08209b396599d4a090a27.png">
<h3>ASU.MANJIRO</h3>
<p>88 Votes</p>
</div>

</div>

<a class="back" href="index.html">⬅ QUAY VỀ TRANG CHỦ</a>

<div id="popup" class="popup">

<div class="popup-box">

<span class="close" onclick="closePlayer()">&times;</span>

<img id="pImg">

<h2 id="pName"></h2>

<p><b>TÊN THẬT:</b> <span id="pReal"></span></p>

<p><b>NĂM SINH:</b> <span id="pBirth"></span></p>

<p><b>ROLE:</b> <span id="pRole"></span></p>

<p><b>TEAM:</b> <span id="pTeam"></span></p>

</div>

</div>

<script>

function showPlayer(name,real,birth,role,team,img){

document.getElementById("popup").style.display="flex";
document.getElementById("pImg").src=img;
document.getElementById("pName").innerHTML=name;
document.getElementById("pReal").innerHTML=real;
document.getElementById("pBirth").innerHTML=birth;
document.getElementById("pRole").innerHTML=role;
document.getElementById("pTeam").innerHTML=team;

}

function closePlayer(){

document.getElementById("popup").style.display="none";

}

</script>

</body>

</html>
